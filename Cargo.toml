[package]
name = "ast_context"
version = "0.3.4"
edition = "2024"
description = "AST/CST-based code graph analysis — index codebases, find dead code, detect redundancy, and expose everything via an MCP server for AI assistants"
license = "MIT"
repository = "https://github.com/agene0001/AstBasedContext-rs"
homepage = "https://github.com/agene0001/AstBasedContext-rs"
keywords = ["ast", "code-analysis", "mcp", "static-analysis", "tree-sitter"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
# Keep the published crate lean — these are dev/test/eval assets, not needed by
# consumers. (Do NOT exclude grammars/ — build.rs compiles the vendored Dart grammar.)
exclude = [
    "eval/",
    "test_project/",
    "tests/",
    "examples/",
    "CLAUDE.md",
    "agents.md",
    ".github/",
]

[features]
# `lsp` enables the opt-in semantic-resolution path: a hand-rolled LSP client
# (no new deps) that spawns a language server such as rust-analyzer to answer
# type/reference queries with certainty. On by default so `--semantic` works out
# of the box; build with `--no-default-features` for the pure-AST, no-subprocess
# binary. The server is only *spawned* when the user passes `--semantic`.
default = ["lsp"]
lsp = []

[[bin]]
name = "ast_context"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6"
petgraph = { version = "0.8.3", features = ["serde-1"] }

# MCP / serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
log = "0.4.32"
env_logger = "0.11"

# Core analysis
tree-sitter = "0.26.9"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-ruby = "0.23"
tree-sitter-php = "0.24.2"
tree-sitter-language = "0.1"
tree-sitter-swift = "0.7.3"
# TODO: Add tree-sitter-kotlin (currently skipped due to dependency issues: crates.io version targets tree-sitter <0.23, and vendoring parser.c is impractical due to 23MB size)
# tree-sitter-dart: vendored via grammars/dart/ (crates.io version targets tree-sitter <0.26)
thiserror = "2.0.18"
ignore = "0.4.26"
rayon = "1.12"
streaming-iterator = "0.1.9"
notify-debouncer-full = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8.2.0", features = ["macos_fsevent"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = { version = "8.2.0" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[build-dependencies]
cc = "1.2.63"

[dev-dependencies]
pretty_assertions = "1"
